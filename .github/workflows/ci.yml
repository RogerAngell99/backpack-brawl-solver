name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test Go
        run: go test ./...

      - name: Test Go search profiling
        run: go test -tags searchprofile ./...

      - name: Verify R1I normal and tagged-off equivalence
        shell: bash
        run: |
          snapshot_dir="$(mktemp -d)"
          R1I_SEMANTIC_SNAPSHOT="$snapshot_dir/normal.json" go test ./internal/solver -run '^TestR1ICrossBuildSemanticSnapshot$' -count=1
          R1I_SEMANTIC_SNAPSHOT="$snapshot_dir/tagged-off.json" go test -tags searchprofile ./internal/solver -run '^TestR1ICrossBuildSemanticSnapshot$' -count=1
          cmp "$snapshot_dir/normal.json" "$snapshot_dir/tagged-off.json"

      - name: Verify pinned search suites
        run: |
          go run ./cmd/backpack-brawl-solver verify-search-suite --manifest benchmarks/suites/general-search-v1.json --catalog data/catalog.json --lock benchmarks/suites/general-search-v1.lock
          go run ./cmd/backpack-brawl-solver verify-search-suite --manifest benchmarks/suites/general-search-v2.json --catalog data/catalog.json --lock benchmarks/suites/general-search-v2.lock

      - name: Verify protected private v2 holdouts
        if: github.ref == 'refs/heads/main'
        env:
          GENERAL_SEARCH_V2_PRIVATE_SEEDS: ${{ secrets.GENERAL_SEARCH_V2_PRIVATE_SEEDS }}
        run: |
          test -n "$GENERAL_SEARCH_V2_PRIVATE_SEEDS"
          umask 077
          private_seeds_file="$(mktemp)"
          trap 'rm -f "$private_seeds_file"' EXIT
          printf '%s' "$GENERAL_SEARCH_V2_PRIVATE_SEEDS" > "$private_seeds_file"
          go run ./cmd/backpack-brawl-solver verify-private-search-suite --manifest benchmarks/suites/general-search-v2.json --catalog data/catalog.json --lock benchmarks/suites/general-search-v2.lock --seeds "$private_seeds_file"

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build web and WASM
        run: npm run build
        working-directory: web
