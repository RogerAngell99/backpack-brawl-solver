name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test Go
        run: go test ./...

      - name: Verify pinned search suites
        run: |
          go run ./cmd/backpack-brawl-solver verify-search-suite --manifest benchmarks/suites/general-search-v1.json --catalog data/catalog.json --lock benchmarks/suites/general-search-v1.lock
          go run ./cmd/backpack-brawl-solver verify-search-suite --manifest benchmarks/suites/general-search-v2.json --catalog data/catalog.json --lock benchmarks/suites/general-search-v2.lock

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build web and WASM
        run: npm run build
        working-directory: web
